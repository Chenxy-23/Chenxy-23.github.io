<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>策划书在线预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      background: #e5e7eb;
      color: #1f2937;
    }

    .v-toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #1f2937;
      color: #fff;
      font-size: 0.9rem;
      flex-wrap: wrap;
    }

    .v-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 40vw;
    }

    .v-spacer { flex: 1; }

    .v-btn {
      min-width: 30px;
      height: 30px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
      line-height: 1;
    }

    .v-btn:hover { background: rgba(255, 255, 255, 0.25); }
    .v-btn.active { background: #4f46e5; }

    .v-page {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .v-page input {
      width: 48px;
      height: 26px;
      border: 0;
      border-radius: 5px;
      padding: 0 4px;
      text-align: center;
      font-size: 0.85rem;
    }

    .v-divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 4px;
    }

    .v-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .v-toc {
      flex: 0 0 260px;
      background: #f9fafb;
      border-right: 1px solid #d1d5db;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: margin-left 0.2s ease;
    }

    .v-toc.hidden { margin-left: -260px; }

    .toc-head {
      padding: 10px 14px;
      font-weight: 700;
      border-bottom: 1px solid #e5e7eb;
      background: #fff;
    }

    .toc-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .toc-item {
      display: block;
      padding: 5px 8px;
      border-radius: 6px;
      color: #374151;
      font-size: 0.83rem;
      text-decoration: none;
      line-height: 1.45;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toc-item:hover { background: #eef2ff; color: #4338ca; }
    .toc-item.current { background: #4f46e5; color: #fff; }

    .v-canvas-wrap {
      flex: 1;
      overflow: auto;
      background: #525659;
      display: flex;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    #pdf-canvas {
      background: #fff;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      align-self: flex-start;
    }

    .v-loading, .v-error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 0.95rem;
      background: rgba(17, 24, 39, 0.75);
      padding: 10px 18px;
      border-radius: 8px;
    }

    @media (max-width: 640px) {
      .v-toc { flex-basis: 220px; }
      .v-toc.hidden { margin-left: -220px; }
      .v-title { max-width: 30vw; }
    }
  </style>
</head>
<body>
  <header class="v-toolbar">
    <button id="btn-toc" class="v-btn" type="button" title="显示 / 隐藏目录">☰</button>
    <span class="v-title">三创赛 · 商务大数据分析实战赛 策划书</span>
    <span class="v-spacer"></span>
    <button id="btn-prev" class="v-btn" type="button" title="上一页（←）">‹</button>
    <span class="v-page">第 <input id="page-input" type="number" min="1" value="1" title="输入页码后回车跳转"> / <span id="page-total">…</span> 页</span>
    <button id="btn-next" class="v-btn" type="button" title="下一页（→）">›</button>
    <span class="v-divider"></span>
    <button id="btn-zoom-out" class="v-btn" type="button" title="缩小">−</button>
    <span id="zoom-level" class="v-page">100%</span>
    <button id="btn-zoom-in" class="v-btn" type="button" title="放大">+</button>
    <span class="v-divider"></span>
    <button id="btn-close" class="v-btn" type="button" title="关闭预览">✕</button>
  </header>

  <div class="v-body">
    <aside id="toc-panel" class="v-toc">
      <div class="toc-head">目录（点击跳转）</div>
      <nav id="toc-list" class="toc-list"></nav>
    </aside>
    <main id="canvas-wrap" class="v-canvas-wrap" oncontextmenu="return false">
      <canvas id="pdf-canvas"></canvas>
      <div id="loading" class="v-loading">正在加载文档…</div>
      <div id="error" class="v-error" hidden>加载失败，请稍后重试。</div>
    </main>
  </div>

  <script src="vendor/pdfjs/pdf.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
