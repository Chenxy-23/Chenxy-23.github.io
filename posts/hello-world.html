      <h1>你好，世界</h1>
      <time class="post-date" datetime="2026-08-12">2026-08-12</time>

      <p>这是我的第一篇博客。作为一个程序员，一直想有一个属于自己的小角落，可以记录学到的东西、踩过的坑，以及偶尔冒出来的想法。</p>

      <p>选择 GitHub Pages 是因为它免费、稳定，而且不需要自己买服务器。只要把 HTML 文件推到仓库里，全世界就能访问到这个页面了，很酷。</p>

      <p>接下来我打算写写编程学习笔记、项目经验，还有生活里的一些小事。不追求更新频率，只希望每一篇都认真写。</p>

      <p>谢谢你的阅读，我们下一篇见。</p>
